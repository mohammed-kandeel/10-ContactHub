<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>ContactHub - Smart Contact Manager</title>
      <link rel="icon" href="./favicon.png" />

      <!-- font-family ("Inter", sans-serif) -->
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />

      <!-- style (fontaswom) -->
      <link rel="stylesheet" href="./css/all.min.css" />
      <!-- style (sweet alert)  -->
      <link rel="stylesheet" href="./css/sweetalert2.min.css" />
      <!-- style (bootstrap) -->
      <link rel="stylesheet" href="./css/bootstrap.min.css" />
      <!-- style (styles) -->
      <link rel="stylesheet" href="./css/utilities.css" />
      <link rel="stylesheet" href="./css/styles.css" />
   </head>
   <body>
      <div class="position-relative z-1">
         <!-- styles -->
         <div class="position-fixed top-0 bottom-0 start-0 end-0 linear-gradient-style pointer-events-none z-n1"></div>

         <!-- nav -->
         <nav class="fixed-top bg-white bg-opacity-75 border-bottom border-1 border-gray-200 border-opacity-50">
            <div class="container px-4 py-3 d-flex align-items-center justify-content-between">
               <div class="d-flex align-items-center gap-2">
                  <div class="linear-gradient-br-violet-600-indigo-600 me-1 text-white shadow-sm-violet-500 fs-18 w-44 h-44 rounded-3 d-flex align-items-center justify-content-center">
                     <i class="fa-solid fa-address-book"></i>
                  </div>
                  <div>
                     <h1 class="m-0 fs-20 fs-sm-24 text-gray-900 fw-7">Contact<span class="text-violet-600">Hub</span></h1>
                     <p class="m-0 fs-12 fw-5 text-gray-500 d-none d-md-block">Smart Contact Manager</p>
                  </div>
               </div>

               <div class="d-flex align-items-center gap-3">
                  <button onclick="displayForm('Add New Contact','add')" ; class="btn add fw-6 d-flex align-items-center gap-1 text-white linear-gradient-r-violet-600-indigo-600">
                     <span class="me-1 fs-10 align-bottom"><i class="fa-solid fa-plus"></i></span>
                     <span>Add</span>
                     <span class="d-none d-md-block">Contact</span>
                  </button>

                  <button class="btn d-none d-md-block bell w-40 h-40 rounded-3 d-flex align-items-center justify-content-center text-gray-500"><i class="fa-solid fa-bell"></i></button>
                  <button class="btn d-none d-md-block gear w-40 h-40 rounded-3 d-flex align-items-center justify-content-center text-gray-500"><i class="fa-solid fa-gear"></i></button>
                  <div class="w-40 h-40 rounded-3 overflow-hidden">
                     <img src="./images/avatar-2.webp" alt="my photo" />
                  </div>
               </div>
            </div>
         </nav>

         <!-- main -->
         <main class="bg-transparent position-relative">
            <!-- number of Contacts -->
            <section id="numberOfContacts">
               <div class="container">
                  <div class="row g-3">
                     <!-- numContact -->
                     <div class="col-6 col-md-4">
                        <div class="p-3 rounded-4 shadow-sm border border-1 border-gray-100 d-flex align-items-center gap-3">
                           <div
                              class="d-flex align-items-center justify-content-center w-44 w-sm-48 h-44 h-sm-48 rounded-4 fs-12 fs-sm-16 text-white shadow-sm-blue-600 linear-gradient-br-blue-500-blue-600"
                           >
                              <i class="fa-solid fa-users"></i>
                           </div>
                           <div>
                              <p class="fs-12 fw-5 m-0 text-gray-500 text-uppercase">Total</p>
                              <p id="numContact" class="fs-20 fs-sm-24 fw-7 m-0 text-gray-900"></p>
                           </div>
                        </div>
                     </div>

                     <!-- num Favorites Contact -->
                     <div class="col-6 col-md-4">
                        <div class="p-3 rounded-4 shadow-sm border border-1 border-gray-100 d-flex align-items-center gap-3">
                           <div
                              class="d-flex align-items-center justify-content-center w-44 w-sm-48 h-44 h-sm-48 rounded-4 fs-14 fs-sm-16 text-white shadow-sm-amber-500 linear-gradient-br-amber-400-orange-500"
                           >
                              <i class="fa-solid fa-star"></i>
                           </div>
                           <div>
                              <p class="fs-12 fw-5 m-0 text-gray-500 text-uppercase">Favorites</p>
                              <p id="numFavoritesContact" class="fs-20 fs-sm-24 fw-7 m-0 text-gray-900"></p>
                           </div>
                        </div>
                     </div>

                     <!-- num Emergency Contact -->
                     <div class="col-6 col-md-4">
                        <div class="p-3 rounded-4 shadow-sm border border-1 border-gray-100 d-flex align-items-center gap-3">
                           <div
                              class="d-flex align-items-center justify-content-center w-44 w-sm-48 h-44 h-sm-48 rounded-4 fs-12 fs-sm-16 text-white shadow-sm-rose-500 linear-gradient-br-rose-500-red-500"
                           >
                              <i class="fa-solid fa-heart-pulse"></i>
                           </div>
                           <div>
                              <p class="fs-12 fw-5 m-0 text-gray-500 text-uppercase">Emergency</p>
                              <p id="numEmergencyContact" class="fs-20 fs-sm-24 fw-7 m-0 text-gray-900"></p>
                           </div>
                        </div>
                     </div>
                  </div>
               </div>
            </section>

            <!-- All Contacts -->
            <section id="allContacts" class="mt-4 pt-2 container p-0">
               <div class="container-fluid px-1">
                  <div class="row">
                     <div class="col-xl-8">
                        <div>
                           <!-- title -->
                           <header>
                              <div class="container">
                                 <h2 class="fs-24 fs-sm-30 text-gray-900 fw-7 mb-0">All Contacts</h2>
                                 <p id="contactsSubTitle" class="mb-0 mt-1 fs-14 text-gray-500"></p>
                              </div>
                           </header>

                           <!-- search -->
                           <section id="search" class="mt-3">
                              <div class="container">
                                 <div class="position-relative">
                                    <span class="position-absolute top-0 bottom-0 start-0 d-flex align-items-center justify-content-center ps-3 text-gray-400">
                                       <i class="fa-solid fa-magnifying-glass"></i>
                                    </span>
                                    <input
                                       type="search"
                                       oninput="displayData(this)"
                                       id="searchInput"
                                       class="form-control bg-gray-50 rounded-4 fs-14 text-gray-700"
                                       placeholder="Search by name, phone, email..."
                                    />
                                 </div>
                              </div>
                           </section>

                           <!-- Contacts -->
                           <section id="contacts" class="mt-4">
                              <div class="container">
                                 <div id="contactsList" class="row g-3"></div>
                              </div>
                           </section>
                        </div>
                     </div>

                     <!-- sidebar -->
                     <aside class="mt-4 m-xl-0 col-xl-4 h-100">
                        <div class="h-100">
                           <!-- Favorites -->
                           <section id="favorites">
                              <div class="container">
                                 <div class="card border border-1 border-gray-100 shadow-md rounded-4">
                                    <div class="card-header p-3 border-bottom border-1 border-gray-100 linear-gradient-r-amber-50-orange-50 d-flex align-items-center gap-2">
                                       <div class="w-32 h-32 fs-12 linear-gradient-br-amber-400-orange-500 text-white rounded-3 d-flex align-items-center justify-content-center me-1">
                                          <i class="fa-solid fa-star"></i>
                                       </div>
                                       <div>
                                          <h2 class="m-0 fs-14 text-gray-900 fw-7">Favorites</h2>
                                          <p class="m-0 fs-12 text-gray-500">Quick access</p>
                                       </div>
                                    </div>

                                    <div class="card-body p-2">
                                       <div class="container-fluid p-1">
                                          <div id="favoritesList" class="row g-2"></div>
                                       </div>
                                    </div>
                                 </div>
                              </div>
                           </section>

                           <!-- Emergency -->
                           <section id="emergency" class="mt-3">
                              <div class="container">
                                 <div class="card border border-1 border-gray-100 shadow-md rounded-4 overflow-hidden">
                                    <div class="card-header p-3 border-bottom border-1 border-gray-100 linear-gradient-r-rose-50-red-50 d-flex align-items-center gap-2">
                                       <div class="w-32 h-32 fs-12 linear-gradient-br-rose-500-red-500 text-white rounded-3 d-flex align-items-center justify-content-center me-1">
                                          <i class="fa-solid fa-heart-pulse"></i>
                                       </div>

                                       <div>
                                          <h2 class="m-0 fs-14 text-gray-900 fw-7">Emergency</h2>
                                          <p class="m-0 fs-12 text-gray-500">Urgent contacts</p>
                                       </div>
                                    </div>

                                    <div class="card-body p-2">
                                       <div class="container-fluid p-1">
                                          <div id="emergencyList" class="row g-2"></div>
                                       </div>
                                    </div>
                                 </div>
                              </div>
                           </section>
                        </div>
                     </aside>
                  </div>
               </div>
            </section>
         </main>
      </div>

      <!-- JS (sweet alert) -->
      <script src="./js/sweetalert2.all.min.js"></script>
      <!-- JS (bootstrap) -->
      <script src="./js/bootstrap.bundle.min.js"></script>
      <!-- JS (styles) -->
      <script src="./js/main.js"></script>
   </body>
</html>
